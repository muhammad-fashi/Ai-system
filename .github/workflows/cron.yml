name: Calling queue cron

# Free replacement for Vercel Cron (the Hobby plan only runs crons once/day).
# It pings your DEPLOYED app to advance the calling queue.
#
# ─────────────────────────────────────────────────────────────────────────
# DISABLED BY DEFAULT: the automatic schedule is commented out so it does NOT
# run (and does NOT email you failures) until you've actually deployed.
#
# To turn it on once your app is live:
#   1. Add two repository secrets (Settings → Secrets and variables → Actions):
#        APP_URL      e.g. https://your-app.vercel.app   (no trailing slash)
#        CRON_SECRET  the same value set in your Vercel env vars
#   2. Uncomment the `schedule:` block below and push.
# ─────────────────────────────────────────────────────────────────────────
on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch: {} # run manually from the Actions tab

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Advance calling queue
        run: |
          # Skip cleanly (no failure email) if secrets aren't configured yet.
          if [ -z "${{ secrets.APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "APP_URL / CRON_SECRET not set — skipping. Configure them to enable."
            exit 0
          fi
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/process-queue")
          echo "process-queue -> HTTP $code"
          cat /tmp/out.txt || true
          [ "$code" = "200" ]

      - name: Process due follow-ups
        if: ${{ secrets.APP_URL != '' && secrets.CRON_SECRET != '' }}
        run: |
          code=$(curl -s -o /tmp/fu.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/process-followups")
          echo "process-followups -> HTTP $code"
          cat /tmp/fu.txt || true
          [ "$code" = "200" ]
